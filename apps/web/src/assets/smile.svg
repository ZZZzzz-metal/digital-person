<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-smile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCBF"/>
      <stop offset="100%" stop-color="#FEEBC8"/>
    </linearGradient>
    <linearGradient id="hair-smile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg-smile)" stroke="#F6AD55" stroke-width="3"/>
  <!-- Body / Clothes -->
  <path d="M50 185 Q100 155 150 185 L150 200 L50 200 Z" fill="#48BB78"/>
  <!-- Neck -->
  <rect x="90" y="130" width="20" height="25" fill="#FFE0B2" rx="5"/>
  <!-- Face -->
  <ellipse cx="100" cy="98" rx="46" ry="48" fill="#FFF3E0"/>
  <!-- Back Hair -->
  <path d="M54 95 Q48 140 68 150 Q60 115 62 90 Z" fill="url(#hair-smile)"/>
  <path d="M146 95 Q152 140 132 150 Q140 115 138 90 Z" fill="url(#hair-smile)"/>
  <!-- Hair Top -->
  <path d="M54 92 C52 50 148 50 146 92 C146 65 125 58 100 58 C75 58 54 65 54 92 Z" fill="url(#hair-smile)"/>
  <!-- Bangs -->
  <path d="M56 82 Q75 102 90 85 Q105 106 125 85 Q135 100 144 86 C138 68 120 62 100 62 C78 62 62 70 56 82 Z" fill="url(#hair-smile)"/>
  <!-- Rosy Blush -->
  <circle cx="73" cy="110" r="8" fill="#F56565" opacity="0.6"/>
  <circle cx="127" cy="110" r="8" fill="#F56565" opacity="0.6"/>
  <!-- Eyes (Happy Arch / Smiling Eyes) -->
  <path d="M74 99 Q80 91 86 99" stroke="#2D3748" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M114 99 Q120 91 126 99" stroke="#2D3748" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- Eyebrows (Upbeat) -->
  <path d="M72 84 Q80 81 88 85" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M112 85 Q120 81 128 84" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <circle cx="100" cy="106" r="1.5" fill="#CBD5E0"/>
  <!-- Mouth (Warm Broad Smile) -->
  <path d="M91 116 Q100 128 109 116" stroke="#E53E3E" stroke-width="2.5" fill="#FED7D7" stroke-linecap="round"/>
</svg>
