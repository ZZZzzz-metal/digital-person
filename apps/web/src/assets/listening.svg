<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-listening" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA"/>
      <stop offset="100%" stop-color="#B2F5EA"/>
    </linearGradient>
    <linearGradient id="hair-listening" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg-listening)" stroke="#38B2AC" stroke-width="3"/>
  <!-- Body / Clothes -->
  <path d="M50 185 Q100 155 150 185 L150 200 L50 200 Z" fill="#319795"/>
  <!-- Neck -->
  <rect x="90" y="130" width="20" height="25" fill="#FFE0B2" rx="5"/>
  <!-- Face -->
  <ellipse cx="100" cy="98" rx="46" ry="48" fill="#FFF3E0"/>
  <!-- Back Hair -->
  <path d="M54 95 Q48 140 68 150 Q60 115 62 90 Z" fill="url(#hair-listening)"/>
  <path d="M146 95 Q152 140 132 150 Q140 115 138 90 Z" fill="url(#hair-listening)"/>
  <!-- Hair Top -->
  <path d="M54 92 C52 50 148 50 146 92 C146 65 125 58 100 58 C75 58 54 65 54 92 Z" fill="url(#hair-listening)"/>
  <!-- Bangs -->
  <path d="M56 82 Q75 102 90 85 Q105 106 125 85 Q135 100 144 86 C138 68 120 62 100 62 C78 62 62 70 56 82 Z" fill="url(#hair-listening)"/>
  <!-- Blush -->
  <circle cx="75" cy="112" r="7" fill="#FEB2B2" opacity="0.6"/>
  <circle cx="125" cy="112" r="7" fill="#FEB2B2" opacity="0.6"/>
  <!-- Headset / Attentive listening ear accessory -->
  <circle cx="50" cy="100" r="10" fill="#4FD1C5" stroke="#234E52" stroke-width="2"/>
  <circle cx="150" cy="100" r="10" fill="#4FD1C5" stroke="#234E52" stroke-width="2"/>
  <path d="M50 90 A 55 55 0 0 1 150 90" stroke="#234E52" stroke-width="3" fill="none"/>
  <!-- Eyes (Wide, Focused, Attentive) -->
  <ellipse cx="80" cy="98" rx="5.5" ry="6" fill="#2D3748"/>
  <circle cx="82" cy="95.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="79" cy="100" r="1" fill="#FFFFFF"/>
  <ellipse cx="120" cy="98" rx="5.5" ry="6" fill="#2D3748"/>
  <circle cx="122" cy="95.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="119" cy="100" r="1" fill="#FFFFFF"/>
  <!-- Eyebrows (Focused, slightly raised) -->
  <path d="M72 87 Q80 84 88 86" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M112 86 Q120 84 128 87" stroke="#4A5568" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <circle cx="100" cy="107" r="1.5" fill="#CBD5E0"/>
  <!-- Mouth (Attentive small circle 'o' listening) -->
  <circle cx="100" cy="118" r="2.5" fill="#E53E3E"/>
</svg>
