  <!-- Back Hair -->
  <path d="M54 95 Q48 140 68 150 Q60 115 62 90 Z" fill="url(#hair-concern)"/>
  <path d="M146 95 Q152 140 132 150 Q140 115 138 90 Z" fill="url(#hair-concern)"/>
