      <stop offset="0%" stop-color="#FED7E2"/>
      <stop offset="100%" stop-color="#E9D8FD"/>
    </linearGradient>
    <linearGradient id="hair-concern" x1="0%" y1="0%" x2="0%" y2="100%">
