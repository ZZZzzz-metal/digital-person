  <path d="M54 92 C52 50 148 50 146 92 C146 65 125 58 100 58 C75 58 54 65 54 92 Z" fill="url(#hair-concern)"/>
  <!-- Bangs -->
  <path d="M56 82 Q75 102 90 85 Q105 106 125 85 Q135 100 144 86 C138 68 120 62 100 62 C78 62 62 70 56 82 Z" fill="url(#hair-concern)"/>
  <!-- Blush -->
  <circle cx="75" cy="113" r="7" fill="#FEB2B2" opacity="0.7"/>
  <circle cx="125" cy="113" r="7" fill="#FEB2B2" opacity="0.7"/>
  <!-- Eyes (Soft Caring Empathy) -->
  <circle cx="80" cy="99" r="5.5" fill="#2D3748"/>
  <circle cx="82" cy="97" r="2.2" fill="#FFFFFF"/>
  <circle cx="120" cy="99" r="5.5" fill="#2D3748"/>
  <circle cx="122" cy="97" r="2.2" fill="#FFFFFF"/>
  <!-- Eyebrows (Concerned / Empathetic slant) -->
  <path d="M72 87 Q80 84 88 89" stroke="#4A5568" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M112 89 Q120 84 128 87" stroke="#4A5568" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <circle cx="100" cy="107" r="1.5" fill="#CBD5E0"/>
  <!-- Mouth (Empathetic caring curve) -->
  <path d="M94 120 Q100 116 106 120" stroke="#E53E3E" stroke-width="2" fill="none" stroke-linecap="round"/>
